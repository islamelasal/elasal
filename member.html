<!doctype html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <meta name="robots" content="noindex">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://prnwlfzwoqpozwddpmxo.supabase.co; img-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
    <link rel="icon" href="./assets/favicon.svg">
    <link rel="stylesheet" href="./assets/base.css?v=2">
    <link rel="stylesheet" href="./assets/brand.css?v=6">
    <title>اشتراكي | أكاديمية العسال للملاكمة</title>
</head>
<body>
    <main class="site-shell">
        <header class="site-header">
            <a class="admin-brand" href="./" aria-label="العودة إلى الموقع"><img src="./assets/elasal-logo.webp" width="1200" height="300" alt=""></a>
            <a class="gold-tool-btn website-link" href="./">موقع الأكاديمية</a>
        </header>
        <section class="dashboard-panel subscriber-panel" aria-labelledby="subscriber-title">
            <h1 id="subscriber-title">اشتراكي</h1>
            <p id="member-feedback" class="muted" role="status">سجّل الدخول بالبريد المسجّل لدى الأكاديمية.</p>
            <form id="member-login">
                <div class="form-gold-group">
                    <label for="member-email">البريد الإلكتروني</label>
                    <input type="email" id="member-email" autocomplete="username" dir="ltr" required maxlength="254">
                </div>
                <div class="form-gold-group">
                    <label for="member-password">كلمة المرور</label>
                    <input type="password" id="member-password" autocomplete="current-password" required maxlength="256">
                </div>
                <button class="primary-gold-btn" type="submit">عرض اشتراكي</button>
            </form>
            <div id="member-details" hidden>
                <h2 id="subscriber-name"></h2>
                <div id="subscriber-subscriptions" class="subscriber-subscriptions"></div>
                <button id="member-logout" class="gold-tool-btn" type="button">تسجيل الخروج</button>
            </div>
        </section>
    </main>
    <script src="./assets/vendor/supabase-js-2.119.2.js" defer></script>
    <script src="./member.js" type="module"></script>
</body>
</html>
